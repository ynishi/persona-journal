[package]
name        = "persona-journal"
description = "Local-first, file-synced, versioned diary for a persona."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true
include = [
    "src/**/*.rs",
    "sql/*.sql",
    "Cargo.toml",
]

[lib]
name = "persona_journal"
path = "src/lib.rs"

[dependencies]
persona-journal-core = { path = "../persona-journal-core", version = "0.1.0" }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
time       = { workspace = true }
rusqlite   = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
tempfile = "3"
static_assertions = "1"
