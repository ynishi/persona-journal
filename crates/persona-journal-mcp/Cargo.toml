[package]
name        = "persona-journal-mcp"
description = "MCP server (and maintenance CLI) for persona-journal."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

[lib]
name = "persona_journal_mcp"
path = "src/lib.rs"

[[bin]]
name = "persona-journal-mcp"
path = "src/main.rs"

[dependencies]
persona-journal = { path = "../persona-journal", version = "0.2.0" }
anyhow       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
toml         = { workspace = true }
rmcp         = { version = "1.6", features = ["server", "transport-io", "macros"] }
time         = { workspace = true, features = ["parsing"] }
schemars     = "1"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap         = { version = "4", features = ["derive"] }

[dev-dependencies]
rmcp     = { version = "1.6", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio      = { version = "1", features = ["full"] }
serde_json = { workspace = true }
