[workspace]
resolver = "2"
members = [
    "crates/persona-journal",
    "crates/persona-journal-core",
    "crates/persona-journal-mcp",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/ynishi/persona-journal"
readme       = "README.md"
authors      = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
rust-version = "1.75"

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
thiserror  = "1"
anyhow     = "1"
time       = { version = "0.3", features = ["formatting", "macros", "serde"] }
rusqlite   = { version = "0.31", features = ["bundled", "functions"] }
tracing    = "0.1"
uuid       = { version = "1.10", features = ["v7"] }
